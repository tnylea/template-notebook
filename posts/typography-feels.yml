html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80" alt="Typography is mostly feeling" /></figure><p>Every typography book I own has rules. Optical kerning above 18pt. Body copy in the 60–75 character range. The Goldilocks line-height. The rules are useful. But they have never, on their own, made anything I've set <em>feel</em> right.</p>
    <p>Typography is mostly feeling. The rules are training wheels for the feeling.</p>
    <h2>What I mean by feeling</h2>
    <p>I mean the small involuntary reaction you have when a paragraph wants to be read. The way some headlines look like they're leaning forward. The way some pages exhale.</p>
    <p>You can describe these things, sometimes, in retrospect. The descender on the f. The way a serif on a number stops it from looking shy. But in the moment of choosing, what you have is mostly a quiet yes or no in your chest. The job is to listen to it.</p>
    <blockquote><p>A typography choice you can&#039;t fully justify is often the one that&#039;s right. The ones you can justify are usually safe.</p></blockquote>
    <h2>How to train the feeling</h2>
    <p>Read a lot of well-set books. Set things in three typefaces and look at them tomorrow. Print things at 100%. Notice when a thing surprises you and then sit with the surprise instead of explaining it away.</p>
    <p>Eventually you'll set a paragraph and know, before you can name why, that it's done. That's the muscle. The rules are how you train it. The feeling is what you actually use.</p>
