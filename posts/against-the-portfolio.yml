html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1581291518857-4e27b48ff24e?auto=format&fit=crop&w=1600&q=80" alt="Against the portfolio" /></figure><p>Last week I read a portfolio case study that opened with the line <em>"After conducting 47 user interviews, we identified three key personas..."</em>. The project was a logo for a candle company.</p>
    <p>I want to say something I've been afraid to say. The portfolio case-study format — the one we all use, the one with the problem statement and the discovery phase and the iteration grid and the impact metrics — has become a kind of fan fiction designers write about themselves.</p>
    <h2>What it crowds out</h2>
    <p>It crowds out instinct. It crowds out the quiet decision a designer makes in the third hour, alone, when nothing on the moodboard fit and they tried something they couldn't justify and it worked.</p>
    <p>It also crowds out failure. The ten projects that didn't make it into the portfolio. The wrong directions you pursued for two weeks. The piece you're still slightly embarrassed by, but learned more from than anything you've published.</p>
    <blockquote><p>The honest case study is the one where you don&#039;t know yet whether it worked.</p></blockquote>
    <h2>What I&#039;d like instead</h2>
    <p>Less narration. More artifact. Show me the third sketch, not the final mockup. Show me what you wrote in the margin. Show me the version you didn't pick and tell me why. The work is more interesting than the story we drape over it.</p>
    <p>I am, of course, writing this on a website with a portfolio.</p>
