html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1504805572947-34fad45aed93?auto=format&fit=crop&w=1600&q=80" alt="A month of mornings" /></figure><p>In December I made a small commitment. For the next month, I would write for the first hour of every day. No email. No Slack. No "just checking" anything. Coffee, the cursor, and one hour.</p>
    <p>This is not a productivity post. I have nothing to sell you. But I want to write down what happened, because I keep forgetting it on the days I most need to remember.</p>
    <h2>What changed</h2>
    <p>The work got better. Not the morning hour — all of it. The afternoons felt easier. The decisions later in the day were sharper. It was as if writing for an hour first was a kind of metabolism — once it ran, the rest of the day knew how to follow.</p>
    <p>I also became kinder. This was less expected. There's something about having already done the thing you most wanted to do that day. It removed a low-grade guilt I hadn't noticed I was carrying. The afternoon stopped feeling like negotiation.</p>
    <h2>What didn&#039;t change</h2>
    <p>I am still tired in the evenings. I still procrastinate on email. I still reach for my phone before my feet are on the floor. The hour didn't fix me. It just gave me one good thing to hold first.</p>
    <blockquote><p>The trick wasn&#039;t the hour. The trick was deciding, in advance, what the hour was for.</p></blockquote>
    <p>I'm starting again on Monday. Not because it's a New Year's thing — because I want the kindness back.</p>
