html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=1600&q=80" alt="Notes on finishing" /></figure><p>I am, by nature, a starter. My notes app is a graveyard of beautiful first paragraphs. For most of my twenties I treated finishing as a personality flaw — the boring tax you paid for the privilege of starting things.</p>
    <p>Then last year I made a decision: every project would have a date. Not a ship date — a <em>"this is done enough to put away"</em> date. It worked better than I want to admit.</p>
    <h2>Five things that helped</h2>
    <p><strong>1. A bad first version, on the calendar.</strong> Decide today when v0.1 will be visible to one other human. Not perfect. Visible. The honesty does the rest.</p>
    <p><strong>2. A separate file for everything that's missing.</strong> Things you notice but won't fix in this version. Naming the thing kills the urge to fix it now.</p>
    <p><strong>3. A "this looks weird but I don't know why" pass.</strong> One quiet evening, no purpose. Walk through the project as if you've never seen it. Mark anything that surprises you.</p>
    <p><strong>4. A friend who is rude to you about scope.</strong> One person who answers <em>"could we also..."</em> with <em>"no, finish first"</em>. Pay them in coffee.</p>
    <p><strong>5. A small, public ritual.</strong> The newsletter, the launch tweet, the email to people who care. Something with a "send" button. The ritual makes the thing real.</p>
    <blockquote><p>Done is not the opposite of good. Done is what makes good legible.</p></blockquote>
    <p>I still feel the gravity toward starting. But I've made my peace with it: I let myself start things, fully. I just promise them, ahead of time, when I will let them go.</p>
