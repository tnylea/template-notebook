html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&w=1600&q=80" alt="Field notes №12" /></figure><p>A loose collection. I keep these as a way of noticing. Some of them will become essays. Most of them won't. That's the point.</p>
    <p><strong>1.</strong> The best identity systems are the ones that look slightly wrong on day one and obviously right by year three.</p>
    <p><strong>2.</strong> "We need to ship faster" is almost never about speed. It's about a meeting someone's afraid to have.</p>
    <p><strong>3.</strong> Overheard at Heart Coffee: "I don't want to be busy. I want to be tired by something I love." Stealing this.</p>
    <p><strong>4.</strong> Asymmetric layouts age better than centered ones. I have no proof.</p>
    <p><strong>5.</strong> If you can't describe the project in one sentence to your mother, it's probably two projects.</p>
    <p><strong>6.</strong> The five-minute walk between meetings is the meeting.</p>
    <p><strong>7.</strong> Designers who only show their finished work eventually stop being able to do new finished work. The unfinished is the soil.</p>
    <p><strong>8.</strong> Reading more poetry. Recommended this fortnight: Mary Oliver, <em>Devotions</em>.</p>
    <p><strong>9.</strong> A good interface answers the question you didn't know you were asking. A great one teaches you that you should have been asking it.</p>
    <p><strong>10.</strong> Saying no to a project I would have said yes to last year. Counting this as growth.</p>
    <p><strong>11.</strong> Re-reading old letters. Most of what I worried about in 2018 didn't happen. The thing that actually did happen, I would not have predicted. I find this comforting.</p>
    <p><strong>12.</strong> The newsletter is up to 3,400 readers. Hello, all of you. I hope you're reading slowly.</p>
