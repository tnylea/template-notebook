html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1493612276216-ee3925520721?auto=format&fit=crop&w=1600&q=80" alt="Slow software and other fictions" /></figure><p>There's a small wave of products lately marketing themselves as <em>slow</em>. Slow email. Slow news. Slow social. Slow writingss. I am, mostly, the target audience for these things. I want to like them.</p>
    <p>And yet. Some of these products are merely fast products with a new word taped to them. The notifications still arrive. The streaks still pressure. The notification dot still glows red. The pacing of the user has not actually been considered, only the pacing of the marketing copy.</p>
    <h2>What slow software actually requires</h2>
    <p>It requires giving things up. Slow software has fewer features. It loads less data. It refuses to surface what it could surface. It accepts smaller addressable markets in exchange for not being a parasite on its users' attention.</p>
    <p>It also requires pricing that reflects this. You cannot be free, ad-supported, and slow. The economics of free always pull the product back toward extraction. Slow has to cost money. The money is the point — it's the thing aligning the product's incentives with the user's peace.</p>
    <blockquote><p>Slow isn&#039;t a feature. It&#039;s a refusal. Most &quot;slow&quot; products aren&#039;t refusing anything.</p></blockquote>
    <p>I'm not against fast software. I love a fast text editor. I love a fast browser. I just want us to stop calling things slow that are merely vibing in a calmer color palette.</p>
