html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=1600&q=80" alt="The discipline of not shipping" /></figure><p>A truth I keep relearning: most of my worst work was shipped on time. Not because I was rushed — because I had a deadline and was disciplined enough to meet it. I confused punctuality with rightness.</p>
    <p>There's a quieter discipline I'm trying to cultivate now. The discipline of not shipping yet. Of holding the work an extra week. Of saying out loud: <em>this isn't the version I want my name on.</em></p>
    <h2>Why this is hard</h2>
    <p>It's hard because it looks indistinguishable from procrastination. The output is the same — nothing visible has happened. But the internal experience is opposite. Procrastination is anxious. Restraint is patient.</p>
    <p>It's also hard because the world rewards visible motion. Anyone can see a launch. No one can see a careful pause.</p>
    <blockquote><p>The work doesn&#039;t care about your calendar. It only cares whether you&#039;ve looked at it long enough.</p></blockquote>
    <p>I'm not saying don't ship. I'm saying: notice when shipping is just the easiest way to stop being uncomfortable. Sometimes the right move is to let the discomfort do its job for one more week.</p>
