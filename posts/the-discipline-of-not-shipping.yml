title: 'The discipline of not shipping'
browser_title: 'The discipline of not shipping — Mara Ellis'
meta_description: "There's a kind of restraint that's harder than working — the discipline of putting something down before it's ready to be seen."
excerpt: "There's a kind of restraint that's harder than working — the discipline of putting something down before it's ready to be seen."
publish_start: '2026-02-22 09:00:00'
