meta_description: 'Six things I wish someone had told me at twenty-three. None of them are about pixels.'
excerpt: 'Six things I wish someone had told me at twenty-three. None of them are about pixels.'
publish_start: '2026-02-04 09:00:00'
category: field-notes
html: |
    <figure class="post-cover"><img src="https://images.unsplash.com/photo-1499914485622-a88fac536970?auto=format&fit=crop&w=1600&q=80" alt="Letters to a younger designer" /></figure><p>Someone wrote in last week, kind enough to ask me what I'd tell my younger self. I've been turning the question over for a few days. Here's what I came back with.</p>
    <p><strong>One.</strong> The career is not the work. The career is the interruptions, the meetings, the politics, the dates on the calendar. The work is the quiet thing you do despite all that. They are not the same. Don't confuse the loud one for the real one.</p>
    <p><strong>Two.</strong> Taste compounds. Style decays. Build your taste like it's a savings account.</p>
    <p><strong>Three.</strong> The senior people you admire are not as confident as you think they are. They've just developed a private relationship with their doubts. You will too.</p>
    <p><strong>Four.</strong> Most "I hate my job" feelings can be solved with two more weeks of rest. Most "I should quit my job" feelings cannot. Learn the difference.</p>
    <p><strong>Five.</strong> Take notes. Bad ones. Lots of them. Future you will be deeply grateful that present you wrote down a thing that seemed obvious.</p>
    <p><strong>Six.</strong> Your relationship to the work is more important than the work. People who love what they do for thirty years are people who protected the love.</p>
    <blockquote><p>Don&#039;t become so good at design that you forget why you wanted to do it.</p></blockquote>
    <p>That's it. That's the letter. I would also have told myself to wear sunscreen, but I don't think she would have listened.</p>
