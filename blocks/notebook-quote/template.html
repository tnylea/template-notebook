<section class="relative bg-paper-50 border-y border-paper-300/70 py-24 lg:py-28 overflow-hidden">
    <div class="pointer-events-none absolute inset-0 -z-10 opacity-[0.05]" aria-hidden="true">
        <svg class="size-full">
            <defs>
                <pattern id="nb-quote-dots" width="22" height="22" patternUnits="userSpaceOnUse">
                    <circle cx="1" cy="1" r="1" fill="currentColor" class="text-ink-900" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#nb-quote-dots)" />
        </svg>
    </div>

    <div class="mx-auto max-w-4xl px-4 text-center lg:px-8">
        <span class="inline-block font-display text-7xl text-ember-300 leading-none -mb-6">&ldquo;</span>
        <blockquote class="font-display text-3xl sm:text-5xl text-ink-900 leading-[1.15] tracking-tight max-w-3xl mx-auto">
            {{ quote|default('') }}
        </blockquote>
        <div class="mt-10 flex items-center justify-center gap-x-4 text-sm">
            {% if author_initials is not empty %}
                <span class="grid size-11 place-items-center rounded-full bg-ember-100 text-ember-800 font-display text-lg">{{ author_initials }}</span>
            {% endif %}
            <div class="text-left">
                <p class="font-medium text-ink-900">{{ author_name|default('') }}</p>
                <p class="text-ink-500">{{ author_title|default('') }}</p>
            </div>
        </div>
    </div>
</section>
