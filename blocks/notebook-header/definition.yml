name: notebook-header
title: "Notebook Header"
description: "Sticky header with monogram logo, navigation, and a 'Say hello' CTA."
category: headers
tags: [notebook, header]
template_engine: twig
fields:
  logo_initial:
    type: text
    label: "Logo Initial"
    default: "n."
  logo_text:
    type: text
    label: "Logo Wordmark"
    default: "notebook"
  nav_label_1:
    type: text
    label: "Nav 1 Label"
    default: "Work"
  nav_url_1:
    type: url
    label: "Nav 1 URL"
    default: "/work"
  nav_label_2:
    type: text
    label: "Nav 2 Label"
    default: "Writings"
  nav_url_2:
    type: url
    label: "Nav 2 URL"
    default: "/writings"
  nav_label_3:
    type: text
    label: "Nav 3 Label"
    default: "About"
  nav_url_3:
    type: url
    label: "Nav 3 URL"
    default: "/about"
  nav_label_4:
    type: text
    label: "Nav 4 Label"
    default: "Now"
  nav_url_4:
    type: url
    label: "Nav 4 URL"
    default: "/now"
  nav_label_5:
    type: text
    label: "Nav 5 Label"
    default: "Contact"
  nav_url_5:
    type: url
    label: "Nav 5 URL"
    default: "/contact"
  cta_text:
    type: text
    label: "CTA Text"
    default: "Say hello"
  cta_url:
    type: url
    label: "CTA URL"
    default: "/contact"
