<div class="bg-paper-200 text-ink-900">
    <div class="mx-auto flex max-w-7xl items-center justify-center gap-x-3 px-4 py-2.5 text-center text-[12px] tracking-[0.14em] uppercase">
        <span class="size-1.5 rounded-full bg-ember-500"></span>
        <span class="font-medium text-ink-600">{{ intro_text|default('New essay') }}&nbsp;—&nbsp;<a href="{{ link_url|default('#') }}" class="ink-link text-ink-600">{{ link_text|default('Latest entry') }}</a></span>
        {% if secondary_text is not empty %}
            <span class="hidden sm:inline-block text-ink-400">·</span>
            <a href="{{ secondary_url|default('#') }}" class="hidden sm:inline-block text-ink-500 hover:text-ink-800 transition">{{ secondary_text }}</a>
        {% endif %}
    </div>
</div>
