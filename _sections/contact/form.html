<section class="relative bg-paper-50 border-y border-paper-300/70 py-20 lg:py-24">
    <div class="mx-auto max-w-3xl px-4 lg:px-8">
        <div class="paper-card rounded-[2rem] p-8 sm:p-12">
            <p class="eyebrow flex items-center"><span class="rule"></span>The Form</p>
            <h2 class="font-display mt-4 text-3xl sm:text-4xl text-ink-900 tracking-tight leading-tight">A few questions, in no particular order.</h2>
            <p class="mt-3 text-ink-600">Or skip the form and just <a href="mailto:hello@theookafor.com" class="ink-link text-ember-700">send an email</a> — same inbox, same answer.</p>

            <form action="#" method="post" class="mt-10 space-y-7">
                <div class="grid gap-7 sm:grid-cols-2">
                    <label class="block">
                        <span class="text-sm font-medium text-ink-800">Your name</span>
                        <input type="text" name="name" required placeholder="Theo Okafor" class="mt-2 w-full rounded-xl border border-paper-300 bg-paper-50 px-4 py-3 text-ink-900 placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-ember-300 focus:border-ember-400 transition" />
                    </label>
                    <label class="block">
                        <span class="text-sm font-medium text-ink-800">Email</span>
                        <input type="email" name="email" required placeholder="you@studio.com" class="mt-2 w-full rounded-xl border border-paper-300 bg-paper-50 px-4 py-3 text-ink-900 placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-ember-300 focus:border-ember-400 transition" />
                    </label>
                </div>

                <fieldset>
                    <legend class="text-sm font-medium text-ink-800">What's this about?</legend>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <label class="cursor-pointer rounded-full border border-paper-300 bg-paper-50 px-4 py-2 text-sm text-ink-700 transition has-[:checked]:bg-ink-900 has-[:checked]:text-paper-50 has-[:checked]:border-ink-900">
                            <input type="radio" name="topic" value="project" class="sr-only" checked /> Project work
                        </label>
                        <label class="cursor-pointer rounded-full border border-paper-300 bg-paper-50 px-4 py-2 text-sm text-ink-700 transition has-[:checked]:bg-ink-900 has-[:checked]:text-paper-50 has-[:checked]:border-ink-900">
                            <input type="radio" name="topic" value="speaking" class="sr-only" /> Speaking
                        </label>
                        <label class="cursor-pointer rounded-full border border-paper-300 bg-paper-50 px-4 py-2 text-sm text-ink-700 transition has-[:checked]:bg-ink-900 has-[:checked]:text-paper-50 has-[:checked]:border-ink-900">
                            <input type="radio" name="topic" value="editorial" class="sr-only" /> Editorial / Coda
                        </label>
                        <label class="cursor-pointer rounded-full border border-paper-300 bg-paper-50 px-4 py-2 text-sm text-ink-700 transition has-[:checked]:bg-ink-900 has-[:checked]:text-paper-50 has-[:checked]:border-ink-900">
                            <input type="radio" name="topic" value="hello" class="sr-only" /> Just to say hello
                        </label>
                    </div>
                </fieldset>

                <label class="block">
                    <span class="text-sm font-medium text-ink-800">Tell me a little about it</span>
                    <textarea name="message" rows="6" required placeholder="What you're working on, the timeline you're imagining, and why you thought of me. The shorter the better — I'll write back with questions." class="mt-2 w-full rounded-xl border border-paper-300 bg-paper-50 px-4 py-3 text-ink-900 placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-ember-300 focus:border-ember-400 transition leading-relaxed"></textarea>
                </label>

                <label class="block">
                    <span class="text-sm font-medium text-ink-800">Budget range <span class="text-ink-400 font-normal">(optional, but helpful)</span></span>
                    <select name="budget" class="mt-2 w-full rounded-xl border border-paper-300 bg-paper-50 px-4 py-3 text-ink-900 focus:outline-none focus:ring-2 focus:ring-ember-300 focus:border-ember-400 transition">
                        <option value="">Choose a range…</option>
                        <option>Under $10k</option>
                        <option>$10k – $25k</option>
                        <option>$25k – $50k</option>
                        <option>$50k+</option>
                        <option>Not sure yet</option>
                    </select>
                </label>

                <div class="flex items-center justify-between gap-4 pt-2">
                    <p class="text-xs text-ink-500 max-w-xs">Your details stay between us — no CRM, no automated follow-ups, no list.</p>
                    <button type="submit" class="inline-flex items-center gap-x-3 rounded-full bg-ink-900 px-7 py-4 text-sm font-medium text-paper-50 ring-1 ring-ink-900 transition hover:-translate-y-0.5 hover:bg-ink-800 disabled:opacity-50">
                        Send the note
                        <svg viewBox="0 0 16 16" class="size-3.5" fill="none" aria-hidden="true"><path d="M3 13L13 3M5 3h8v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
